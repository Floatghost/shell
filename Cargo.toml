[package]
name = "shell"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.43"
crossterm = "0.29.0"
ctrlc = "3.5.1"
phf = { version = "0.13.1", features = ["macros"] }
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
strum = "0.27.2"
strum_macros = "0.27.2"
sysinfo = "0.38.0"
toml = "0.9.11"
unicode-width = "0.2.2"


[profile.release]
codegen-units = 1
lto = "fat"
